services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fileloader}
      POSTGRES_USER: ${POSTGRES_USER:-fileloader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - fileloader-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  fileloader:
    build: .
    container_name: fileloader
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      APP_TOKEN: ${APP_TOKEN:?Ustaw APP_TOKEN w pliku .env}
      DATA_DIR: /data
      NFS_DIR: /mnt/nfs
      REQUIRE_NFS: "${REQUIRE_NFS:-true}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-53687091200}"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-fileloader}
      DB_USER: ${POSTGRES_USER:-fileloader}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w pliku .env}
    volumes:
      - fileloader-data:/data
      - nfs-destination:/mnt/nfs
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  fileloader-data:
  fileloader-postgres-data:
  nfs-destination:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:?Ustaw NFS_SERVER w pliku .env},nfsvers=${NFS_VERSION:-4.1},rw"
      device: ":${NFS_EXPORT:?Ustaw NFS_EXPORT w pliku .env}"
